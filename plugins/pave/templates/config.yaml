# Pave policy. Shared by the team - commit this file.
# Contains nothing machine-specific. Your repo paths live in workspace.yaml.

# Who does each piece of work, and how strong they should be.
# Every entry is enforced: skills look it up with `pave.sh agent <name>`
# and pass model and effort when the agent is spawned.
agents:
  analyst:   { model: sonnet, effort: medium }   # reads business logic
  builder:   { model: sonnet, effort: medium }   # writes the code of one task document
  explorer:  { model: haiku,  effort: low    }   # mechanical repo scanning
  reviewer:  { model: sonnet, effort: low    }   # one per task: task vs code
  retriever: { model: sonnet, effort: low    }   # answers hub questions

  # The planner decides everything build and review then only execute, so a
  # poor plan cannot be rescued later. The strongest model you have is
  # recommended; /pave:plan runs it on exactly what is set here.
  planner:  { model: opus, effort: high }       # planning decides the feature

execution:
  # parallel: every task whose depends_on are done runs at once, in one
  # service as well as across services - the plan's depends_on is what keeps
  # tasks apart. sequential: one task at a time.
  mode: parallel                 # parallel | sequential
  max_parallel: 4

# Only for service repos under git: builders there work on this branch.
# A repo without git gets no branch; Pave never reads one back.
branch:
  pattern: feature/{feature-id}
  # true: at the end of /pave:build, one commit per repo, made by the build
  #       command - never by a builder.
  # false: nothing is committed; /pave:build asks you at the end.
  autocommit: false

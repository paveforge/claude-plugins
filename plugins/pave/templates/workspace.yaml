# Your repos. Source of truth - edit freely, Pave reads what is here.
# Seeded by /pave:init; re-running backs this up to workspace-old.yaml first.
# Local to your machine. Not committed.
#
# Paths are ABSOLUTE. This file never leaves your machine, so relative paths
# would buy nothing and cost an ambiguity: skills run from inside a service
# repo as well as from the hub, and a relative path means different things
# from each.

generated_at: 2026-01-01T00:00:00Z

repos:
  - path: /Users/you/order-service
    default_branch: main
    services: [order-service]
  - path: /Users/you/storefront
    default_branch: main
    services: [web-checkout, shared-events]   # monorepo: two services, one repo

ignored:                    # init will not ask about these again
  - /Users/you/infra

services:
  - name: order-service
    repo: /Users/you/order-service
    path: .
    kind: service           # service | library | app | infra
    language: go
    claude_md: /Users/you/order-service/CLAUDE.md   # repo has its own; agents read it
    commands:
      build: make build
      test:  go test ./...
      lint:  golangci-lint run
      codegen: buf generate
    contracts:
      - kind: protobuf      # protobuf | openapi | graphql | json-schema | avro | prose
        path: proto/order/v1/order.proto
        role: producer
    consumes: [stock-service]

  - name: shared-events
    repo: /Users/you/storefront
    path: packages/events
    kind: library           # publishes a version; consumers bump the pin
    language: typescript
    commands:
      build:   pnpm --filter events build
      test:    pnpm --filter events test
      publish: pnpm --filter events publish
    contracts:
      - kind: json-schema
        path: packages/events/schemas/
        role: producer
    consumes: []
